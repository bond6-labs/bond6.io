name: Deploy Bond6 to Cloudflare

on:
  push:
    branches: [codex/transmissions]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bond6-cloudflare-deploy

jobs:
  deploy:
    if: github.ref == 'refs/heads/codex/transmissions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Apply additive database migrations
        run: npm run migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy --var BUILD_VERSION:${GITHUB_SHA}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production release
        run: node scripts/smoke-production.mjs
        env:
          BOND6_EXPECTED_RELEASE: ${{ github.sha }}
